name: Build AnyPS5 Toolchain

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MinGW-w64 GCC
      uses: egor-tisin/setup-mingw-gh-action@v2
      with:
        version: 15.2.0
        platform: x64

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure and Build
      run: |
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release
      shell: pwsh

    - name: Package Toolchain
      run: |
        mkdir dist
        # העתקת קובץ ה-Relinker והספריות המקומפלות (DLLs)
        Copy-Item -Path build/*.exe, build/*.dll -Destination dist/ -ErrorAction SilentlyContinue
        cd dist
        Compress-Archive -Path * -DestinationPath ../AnyPS5-Toolchain.zip
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: AnyPS5-Toolchain.zip
        name: AnyPS5 Toolchain ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
