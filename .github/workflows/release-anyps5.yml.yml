name: Build and Release AnyPS5 Core

on:
  push:
    tags:
      - 'v*' # יופעל בכל פעם שתדחוף תג חדש (למשל v1.0.0)
  workflow_dispatch: # מאפשר הרצה ידנית לבדיקה דרך ה-UI

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # מוריד את כל תתי-הספריות הנדרשות לפרויקט

    - name: Setup MinGW-w64 GCC
      uses: egor-tisin/setup-mingw-gh-action@v2
      with:
        version: 15.2.0 # הדרישה הרשמית של boykopovar לגרסה זו
        platform: x64

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
      shell: pwsh

    - name: Build Project
      run: |
        cd build
        cmake --build . --config Release
      shell: pwsh

    - name: Package Binary Artifacts
      run: |
        mkdir dist
        # מעתיק את קובצי ההרצה (relinker) והספריות המומרות שנוצרו
        Copy-Item -Path build/*.exe, build/*.dll, build/*.a -Destination dist/ -ErrorAction SilentlyContinue
        cd dist
        Compress-Archive -Path * -DestinationPath ../AnyPS5-Core-Windows.zip
      shell: pwsh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: AnyPS5-Core-Windows.zip
        name: AnyPS5 Core Build ${{ github.ref_name }}
        tag_name: ${{ github.ref }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
